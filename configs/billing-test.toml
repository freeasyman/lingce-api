# 计费缴费「第 0 阶段」本地验证配置：只连本机 PostgreSQL，不连任何远程库。
#
# 用法（测试库由 setup 脚本重建，见脚本头注释）：
#   1. bash scripts/billing/setup-billing-test-db.sh
#   2. 可选：go run ./cmd/lingce-api --config ./configs/billing-test.toml --migrate-only
#      （已迁移时不会重复执行，可用来验证幂等）
#   3. BILLING_TEST_DATABASE_URL='postgresql://yiliiang:billing_local_test@127.0.0.1:5432/lingce_billing_test?sslmode=disable' \
#        go test ./internal/billing/ -run TestBillingEndToEnd -v
#
# secrets 文件是本机测试专用弱口令（本机 pg 是 trust 认证，密码只用于通过 config 校验），
# 已在 .gitignore 中忽略，不要提交、不要用于任何真实环境。

[app]
name = "lingce-api"
env = "test"
secrets_file = "./secrets.billing-test.toml"
# 仅本机测试：HTTP 验收脚本登录用的固定验证码（生产配置不要设置）。
test_captcha_code = "8888"

[server]
port = "18099"
host = "127.0.0.1"

[database]
host = "127.0.0.1"
port = 5432
name = "lingce_billing_test"
user = "yiliiang"
sslmode = "disable"
max_conns = 10
min_conns = 1

[schema]
# 加载全部版本化 migration（包括计费相关 20261110_002 / 20261110_004 与后续新增）。
max_migration_version = ""

[jwt]
expiry_hours = 24

[external]
llm_gateway_url = "http://localhost:8080"
badge_middleware_url = "http://localhost:18082"

[log]
level = "info"
