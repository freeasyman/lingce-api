[app]
name = "lingce-api"
env = "dev"
secrets_file = "./secrets.local.toml"

[server]
port = "18080"
host = "0.0.0.0"

[database]
host = "pgm-2ze5k275270fch1pmo.pg.rds.aliyuncs.com"
port = 5432
name = "lingce_dev"
user = "freeasyman"
sslmode = "disable"
max_conns = 10
min_conns = 2

[schema]
# 开发环境默认不设上限，加载全部版本化 migration。
max_migration_version = ""

[jwt]
expiry_hours = 24

[recording]
play_url_require_owned_media = true
reset_code_dictionary_path = "./reset_code_dictionary.json"

[external]
llm_gateway_url = "http://localhost:8080"
badge_middleware_url = "http://localhost:18082"
recording_worker_url = "http://localhost:18090"
lingce_worker_url = "http://localhost:18083"
# 阶段 4A 外部 HIS 测试数据固定写入开发租户 1；请求体不能自行指定租户。
external_data_tenant_id = 1
content_analysis_tenant_id = 4
# 开发环境默认开启实时麦克风录音的随访投递；生产环境请按联调结果显式配置。
emr_followup_delivery_enabled = true

[external.ticket_notify]
smtp_port = 25

[aliyun]
sms_sign_name = ""
sms_template_code = ""
oss_endpoint = "oss-cn-beijing.aliyuncs.com"
oss_bucket = "lince"
oss_public_base_url = "https://lince.oss-cn-beijing.aliyuncs.com"

[wecom]
api_base_url = "https://qyapi.weixin.qq.com"

[log]
level = "debug"

[content]
# 内容获客：录音→洞察→选题 自动补齐
analysis_enabled = true
analysis_interval_seconds = 120
analysis_batch = 2

[deal]
# 赢客专家后台分析版本：默认 v200；dev 切 v210-rc11（v2.1 新流水线，服务端适配回 v1.1 展示契约）。
# 可选值：v200 / v210-rc11。prod/test 不配置时保持 v200。
analysis_version = "v200"
# v2 即时分析与咨询师短信默认关闭；新界面联调时再打开。
instant_enabled = false
consultant_sms_enabled = false

# 实时推送：当前只干跑（只记录事件与短链，不发送短信/企微）。
[deal.push]
enabled = false
dry_run = true
whitelist = ["18610815948"]
h5_base_url = "http://127.0.0.1:3012"
short_link_base = "https://khgl.xyz/s"
sms_sign_name = "天津灵策科技"
sms_template_consultant = "SMS_512628042"
sms_template_manager = "SMS_512538140"
sms_template_fallback = "SMS_512617916"
