openapi: 3.0.3
info:
  title: 灵策医疗运营系统 API
  description: |
    灵策医疗运营系统的统一后端 API 服务，提供完整的医疗运营管理功能。

    ## 功能模块
    - **认证模块**: 用户登录、令牌管理、密码修改
    - **组织架构**: 机构、部门、员工、医生、患者管理
    - **录音管理**: 问诊录音、转写、分析、任务管理
    - **权限管理**: RBAC权限控制、角色菜单管理
    - **系统配置**: 租户配置、订阅管理、功能控制
    - **智能工牌**: 设备生命周期、录音控制、厂商同步
    - **内容管理**: 选题、内容生成、发布、GEO优化
    - **客户管理**: 客户信息、标签、分组、跟进记录
    - **支撑模块**: 通知、日志、LLM配置、就诊管理

    ## 认证方式
    所有需要认证的接口都需要在请求头中携带JWT令牌：
    ```
    Authorization: Bearer <token>
    ```

    ## 用户类型
    - `admin`: 运维管理员，可访问所有租户数据
    - `employee`: 机构员工（Web端），只能访问自己租户的数据
    - `mobile`: 移动端用户，与employee权限相同但会话独立

    ## 响应格式

    ### 成功响应
    ```json
    {
      "data": {
        // 响应数据
      }
    }
    ```

    ### 分页响应
    ```json
    {
      "items": [...],
      "total": 100,
      "page": 1,
      "page_size": 20
    }
    ```

    ### 错误响应
    ```json
    {
      "code": "ERROR_CODE",
      "message": "错误描述",
      "details": null
    }
    ```

  version: 1.0.0
  contact:
    name: 灵策医疗技术支持
    email: support@lingce.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:18080
    description: 本地开发环境
  - url: https://api.lingce.com
    description: 生产环境

tags:
  - name: 认证
    description: 用户认证、登录、令牌管理
  - name: 组织架构
    description: 机构、部门、员工管理
  - name: 医生管理
    description: 医生信息、业绩统计、员工映射
  - name: 患者管理
    description: 患者信息、360度视图
  - name: 录音管理
    description: 问诊录音CRUD、统计分析
  - name: 录音任务
    description: 录音任务管理、分配、跟踪
  - name: 录音提示词
    description: 录音分析提示词配置
  - name: 医疗录音看板
    description: 质控、医生能力、团队分析
  - name: 权限管理
    description: 运营端RBAC权限控制
  - name: 机构权限
    description: 机构端RBAC权限控制
  - name: 系统配置
    description: 租户配置、订阅管理、功能控制
  - name: 智能工牌
    description: 设备生命周期、录音控制
  - name: 设备检测
    description: 设备验收、检测、厂商验证
  - name: 厂商池同步
    description: 厂商设备池同步、差异对比
  - name: 内容管理
    description: 选题、内容生成、发布
  - name: 发布任务
    description: 内容发布任务管理
  - name: GEO优化
    description: 内容SEO优化分析
  - name: 素材池
    description: 录音衍生素材管理
  - name: 提示词模板
    description: 通用提示词模板管理
  - name: 客户管理
    description: 客户信息、互动、跟进
  - name: 客户标签
    description: 客户标签管理
  - name: 客户分组
    description: 客户动态分组
  - name: 支撑模块
    description: 通知、日志、LLM配置

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT令牌认证。通过登录接口获取token后，在请求头中携带：
        ```
        Authorization: Bearer <token>
        ```

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码
          example: INVALID_REQUEST
        message:
          type: string
          description: 错误描述
          example: 请求参数无效
        details:
          type: object
          nullable: true
          description: 错误详情

    PaginatedResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items: {}
          description: 数据列表
        total:
          type: integer
          format: int64
          description: 总记录数
          example: 100
        page:
          type: integer
          description: 当前页码
          example: 1
        page_size:
          type: integer
          description: 每页记录数
          example: 20

    SuccessResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: 响应数据

    # 认证相关模型
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名
          example: admin
        password:
          type: string
          format: password
          description: 密码
          example: password123
        captcha_id:
          type: string
          description: 验证码ID（可选）
        captcha_code:
          type: string
          description: 验证码（可选）

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID
          example: 1
        username:
          type: string
          description: 用户名
          example: admin
        user_type:
          type: string
          enum: [admin, employee, mobile]
          description: 用户类型
          example: admin
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: 租户ID（admin为null）
          example: 1
        employee_id:
          type: integer
          format: int64
          nullable: true
          description: 员工ID（admin为null）
          example: 1

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: 旧密码
        new_password:
          type: string
          format: password
          description: 新密码（至少6位）
          minLength: 6

    # 机构相关模型
    Tenant:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: 机构名称
          example: 北京协和医院
        code:
          type: string
          description: 机构代码
          example: BJ001
        contact_person:
          type: string
          description: 联系人
          example: 张三
        contact_phone:
          type: string
          description: 联系电话
          example: 13800138000
        is_active:
          type: boolean
          description: 是否启用
          example: true
        valid_from:
          type: string
          format: date
          description: 有效期开始
          example: "2024-01-01"
        valid_to:
          type: string
          format: date
          nullable: true
          description: 有效期结束
          example: "2025-12-31"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    # 部门相关模型
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        tenant_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: 部门名称
          example: 心内科
        code:
          type: string
          description: 部门代码
          example: DEPT001
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 父部门ID
          example: null
        level:
          type: integer
          description: 层级
          example: 1
        sort_order:
          type: integer
          description: 排序
          example: 1
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 员工相关模型
    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        tenant_id:
          type: integer
          format: int64
          example: 1
        department_id:
          type: integer
          format: int64
          nullable: true
          example: 1
        username:
          type: string
          example: zhangsan
        name:
          type: string
          example: 张三
        phone:
          type: string
          example: "13800138000"
        email:
          type: string
          format: email
          example: zhangsan@example.com
        job_title:
          type: string
          example: 主治医师
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 录音相关模型
    Recording:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        tenant_id:
          type: integer
          format: int64
          example: 1
        employee_id:
          type: integer
          format: int64
          example: 1
        patient_name:
          type: string
          example: 李四
        patient_phone:
          type: string
          example: "13900139000"
        recording_url:
          type: string
          format: uri
          example: https://oss.example.com/recordings/123.mp3
        duration:
          type: integer
          description: 时长（秒）
          example: 300
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: completed
        transcription:
          type: string
          nullable: true
          description: 转写文本
        doctor_summary:
          type: string
          nullable: true
          description: 医生摘要
        therapist_summary:
          type: string
          nullable: true
          description: 治疗师摘要
        consultant_summary:
          type: string
          nullable: true
          description: 顾问摘要
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    UnauthorizedError:
      description: 未授权 - 令牌无效或已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Invalid or expired token
            details: null

    ForbiddenError:
      description: 禁止访问 - 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Insufficient permissions
            details: null

    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found
            details: null

    BadRequestError:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Invalid request parameters
            details: null

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Internal server error
            details: null

security:
  - BearerAuth: []

paths:
  # ==================== 认证模块 ====================
  /api/v1/auth/login:
    post:
      tags:
        - 认证
      summary: 运维管理员登录
      description: 运维管理员使用用户名密码登录，获取JWT令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login/institution:
    post:
      tags:
        - 认证
      summary: 机构员工登录
      description: 机构员工使用用户名密码登录（Web端）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: 用户名或密码错误

  /api/v1/auth/login/employee:
    post:
      tags:
        - 认证
      summary: 员工登录（别名）
      description: 与机构员工登录相同，提供别名接口
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/login/mobile:
    post:
      tags:
        - 认证
      summary: 移动端登录
      description: 移动端用户登录，会话与Web端独立
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/me:
    get:
      tags:
        - 认证
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/change-password:
    post:
      tags:
        - 认证
      summary: 修改密码
      description: 修改当前用户密码，修改后旧令牌失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Password changed successfully
        '400':
          description: 旧密码错误或新密码不符合要求
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/captcha:
    get:
      tags:
        - 认证
      summary: 生成图形验证码
      description: 生成图形验证码，返回验证码ID和Base64图片
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      captcha_id:
                        type: string
                        example: abc123
                      captcha_image:
                        type: string
                        description: Base64编码的图片
                        example: data:image/png;base64,iVBORw0KG...

  /api/v1/auth/mobile/sms/send:
    post:
      tags:
        - 认证
      summary: 发送短信验证码
      description: 向指定手机号发送短信验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: SMS sent successfully
        '400':
          description: 手机号格式错误或发送频率过高

  /api/v1/auth/mobile/sms/login:
    post:
      tags:
        - 认证
      summary: 短信验证码登录
      description: 使用手机号和短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  example: "13800138000"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 验证码错误或已过期
